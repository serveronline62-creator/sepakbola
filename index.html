<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pemotong Video Otomatis</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; background: #f5f5f7; }
  .container { background: #fff; border-radius: 10px; padding: 2rem; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { color: #222; margin-top: 0; }
  .input-group { margin-bottom: 1rem; }
  label { display: block; margin-bottom: .4rem; font-weight: 600; color: #333; }
  input[type="file"], input[type="number"] {
    width: 100%; padding: .6rem; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;
  }
  button {
    background: #007bff; color: #fff; border: 0; padding: .8rem 1.6rem;
    border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: 600;
    transition: background .2s;
  }
  button:hover:not(:disabled) { background: #0069d9; }
  button:disabled { background: #b8b8b8; cursor: not-allowed; }
  #status { margin-top: 1rem; padding: .75rem 1rem; background: #eef4ff; border-left: 4px solid #007bff; border-radius: 4px; color: #1a1a1a; font-family: ui-monospace, monospace; font-size: .9rem; min-height: 1.2rem; }
  #results { margin-top: 2rem; }
  .clip-item { background: #f9f9f9; padding: 1rem; border-radius: 6px; margin-bottom: .75rem; border: 1px solid #eaeaea; }
  .clip-item p { margin: 0 0 .5rem 0; font-size: .9rem; color: #444; }
  .clip-item a { color: #007bff; font-weight: 600; text-decoration: none; }
  .clip-item a:hover { text-decoration: underline; }
  .hint { font-size: .85rem; color: #666; margin-top: .3rem; }
</style>
</head>
<body>
<div class="container">
  <h1>✂️ Pemotong Video Otomatis</h1>
  <p>Unggah video panjang, lalu potong menjadi klip-klip pendek. Semua proses berjalan <strong>di browser Anda</strong> — file tidak diunggah ke mana pun.</p>

  <div class="input-group">
    <label for="videoInput">Pilih File Video:</label>
    <input type="file" id="videoInput" accept="video/*" />
  </div>

  <div class="input-group">
    <label for="durationInput">Durasi per Klip (detik):</label>
    <input type="number" id="durationInput" value="60" min="1" step="1" />
    <div class="hint">Contoh: 60 = 1 menit, 30 = 30 detik.</div>
  </div>

  <button id="processBtn" disabled>Potong Video</button>
  <div id="status">Memuat modul FFmpeg…</div>

  <div id="results">
    <h2 style="font-size:1.15rem;">Hasil Klip:</h2>
    <div id="clipsContainer"></div>
  </div>
</div>

<!-- FFmpeg.wasm 0.12.x (UMD) + util -->
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<script>
(function () {
  "use strict";

  const { FFmpeg } = FFmpegWASM;
  const { fetchFile, toBlobURL } = FFmpegUtil;

  const ffmpeg = new FFmpeg();
  let ffmpegLoaded = false;

  const videoInput   = document.getElementById("videoInput");
  const durationInput = document.getElementById("durationInput");
  const processBtn   = document.getElementById("processBtn");
  const statusDiv    = document.getElementById("status");
  const clipsContainer = document.getElementById("clipsContainer");

  let videoFile = null;

  // Log FFmpeg ke console untuk debug
  ffmpeg.on("log", ({ message }) => console.log("[ffmpeg]", message));

  // Progress per job
  ffmpeg.on("progress", ({ progress }) => {
    if (progress > 0 && progress <= 1) {
      statusDiv.textContent = `Memproses… ${Math.round(progress * 100)}%`;
    }
  });

  // ---------- Load FFmpeg core (sekali saja) ----------
  async function loadFFmpeg() {
    if (ffmpegLoaded) return;
    statusDiv.textContent = "Memuat FFmpeg core (butuh beberapa detik pertama kali)…";

    const baseURL = "https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd";
    await ffmpeg.load({
      coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, "text/javascript"),
      wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, "application/wasm"),
    });
    ffmpegLoaded = true;
    statusDiv.textContent = "FFmpeg siap.";
  }

  // ---------- Deteksi durasi video ----------
  function getVideoDuration(file) {
    return new Promise((resolve, reject) => {
      const v = document.createElement("video");
      v.preload = "metadata";
      v.muted = true;
      v.onloadedmetadata = () => {
        const dur = v.duration;
        URL.revokeObjectURL(v.src);
        resolve(dur);
      };
      v.onerror = () => {
        URL.revokeObjectURL(v.src);
        reject(new Error("Gagal membaca metadata video (format mungkin tidak didukung browser)."));
      };
      v.src = URL.createObjectURL(file);
    });
  }

  // ---------- Event handler ----------
  videoInput.addEventListener("change", (e) => {
    videoFile = e.target.files[0] || null;
    if (videoFile) {
      const mb = (videoFile.size / 1024 / 1024).toFixed(1);
      statusDiv.textContent = `File dipilih: ${videoFile.name} (${mb} MB)`;
      processBtn.disabled = false;
    } else {
      statusDiv.textContent = "Tidak ada file.";
      processBtn.disabled = true;
    }
  });

  processBtn.addEventListener("click", async () => {
    if (!videoFile) return;

    clipsContainer.innerHTML = "";
    processBtn.disabled = true;

    const segment = parseInt(durationInput.value, 10);
    if (!segment || segment < 1) {
      statusDiv.textContent = "❌ Durasi harus minimal 1 detik.";
      processBtn.disabled = false;
      return;
    }

    try {
      await loadFFmpeg();

      const ext = (videoFile.name.split(".").pop() || "mp4").toLowerCase();
      const inputName = `input.${ext}`;
      const mime = videoFile.type || `video/${ext === "mov" ? "quicktime" : ext}`;

      statusDiv.textContent = "Menulis file ke sistem file virtual…";
      await ffmpeg.writeFile(inputName, await fetchFile(videoFile));

      statusDiv.textContent = "Mendeteksi durasi video…";
      const total = await getVideoDuration(videoFile);
      if (!total || !isFinite(total)) throw new Error("Durasi video tidak valid.");

      const totalSegments = Math.ceil(total / segment);
      statusDiv.textContent = `Total durasi ${total.toFixed(1)} dtk → ${totalSegments} klip.`;

      for (let i = 0; i < totalSegments; i++) {
        const start = i * segment;
        const remaining = Math.min(segment, total - start);
        if (remaining < 0.2) break; // terlalu pendek, lewati

        const outputName = `clip_${String(i + 1).padStart(3, "0")}.${ext}`;
        statusDiv.textContent = `Memotong klip ${i + 1}/${totalSegments} (mulai ${start.toFixed(1)} dtk)…`;

        // -ss sebelum -i = cepat (keyframe-aligned)
        // -avoid_negative_ts make_zero = hindari timestamp negatif
        await ffmpeg.exec([
          "-ss", start.toFixed(3),
          "-i", inputName,
          "-t", remaining.toFixed(3),
          "-c", "copy",
          "-avoid_negative_ts", "make_zero",
          "-reset_timestamps", "1",
          outputName,
        ]);

        const data = await ffmpeg.readFile(outputName);
        if (!data || data.length === 0) {
          console.warn(`Klip ${i + 1} kosong, dilewati.`);
          await ffmpeg.deleteFile(outputName).catch(() => {});
          continue;
        }

        const blob = new Blob([data], { type: mime });
        const url = URL.createObjectURL(blob);

        const el = document.createElement("div");
        el.className = "clip-item";
        el.innerHTML = `
          <p><strong>Klip ${i + 1}</strong> — mulai ${start.toFixed(1)} dtk, durasi ±${remaining.toFixed(1)} dtk</p>
          <a href="${url}" download="${outputName}">⬇ Unduh ${outputName}</a>
        `;
        clipsContainer.appendChild(el);

        await ffmpeg.deleteFile(outputName).catch(() => {});
      }

      await ffmpeg.deleteFile(inputName).catch(() => {});
      statusDiv.textContent = `✅ Selesai! ${totalSegments} klip telah dibuat.`;

    } catch (err) {
      console.error(err);
      statusDiv.textContent = `❌ Error: ${err.message}`;
    } finally {
      processBtn.disabled = false;
    }
  });

  // Mulai memuat FFmpeg begitu halaman siap
  loadFFmpeg().catch((err) => {
    console.error(err);
    statusDiv.textContent = `❌ Gagal memuat FFmpeg: ${err.message}`;
  });
})();
</script>
</body>
</html>
